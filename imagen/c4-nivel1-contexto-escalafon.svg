<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:700}.sub{font-size:14px;fill:#475569}
      .h{font-size:16px;font-weight:700}.b{font-size:13px}.s{font-size:11px;fill:#475569}.box{stroke-width:1.6}
      .edge{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:1.4;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="40" y="40" class="t title">C4 Nivel 1 · Contexto del Sistema</text>
  <text x="40" y="65" class="t sub">Sistema de Gestión Escalafonaria del Personal Municipal</text><rect x="80" y="150" width="300" height="120" rx="12" fill="#24477f" stroke="#18345f" class="box"/><text x="230" y="184" text-anchor="middle" class="t h">Administrador del Sistema</text><text x="230" y="215" text-anchor="middle" class="t s">Usuarios, roles, permisos</text><text x="230" y="232" text-anchor="middle" class="t s">sesiones y auditoría</text><rect x="80" y="335" width="300" height="120" rx="12" fill="#24477f" stroke="#18345f" class="box"/><text x="230" y="369" text-anchor="middle" class="t h">Responsable de Escalafón</text><text x="230" y="400" text-anchor="middle" class="t s">Gestiona legajos oficiales,</text><text x="230" y="417" text-anchor="middle" class="t s">historial, documentos y reportes</text><rect x="80" y="520" width="300" height="120" rx="12" fill="#24477f" stroke="#18345f" class="box"/><text x="230" y="554" text-anchor="middle" class="t h">Trabajador municipal</text><text x="230" y="585" text-anchor="middle" class="t s">Consulta su legajo y</text><text x="230" y="602" text-anchor="middle" class="t s">presenta solicitudes</text><rect x="80" y="705" width="300" height="120" rx="12" fill="#24477f" stroke="#18345f" class="box"/><text x="230" y="739" text-anchor="middle" class="t h">Consulta Interna / Gerencia</text><text x="230" y="770" text-anchor="middle" class="t s">Indicadores y reportes</text><text x="230" y="787" text-anchor="middle" class="t s">agregados autorizados</text><rect x="555" y="280" width="590" height="340" rx="18" fill="#4472c4" stroke="#2f5597" class="box"/><text x="850" y="345" text-anchor="middle" class="t h">Sistema de Gestión Escalafonaria</text><text x="850" y="385" text-anchor="middle" class="t b">Sistema web interno para administrar el legajo</text><text x="850" y="402" text-anchor="middle" class="t b">escalafonario, historial laboral, documentos,</text><text x="850" y="419" text-anchor="middle" class="t b">solicitudes, alertas, dashboard y reportes.</text><text x="850" y="475" text-anchor="middle" class="t b">Municipalidad Provincial de Huamanga</text><text x="850" y="520" text-anchor="middle" class="t s">No incluye planillas, remuneraciones, asistencia,</text><text x="850" y="537" text-anchor="middle" class="t s">presupuesto ni cálculo de beneficios laborales.</text><rect x="1310" y="165" width="310" height="125" rx="12" fill="#e5e7eb" stroke="#6b7280" class="box"/><text x="1465" y="203" text-anchor="middle" class="t h">RENIEC</text><text x="1465" y="237" text-anchor="middle" class="t s">Validación opcional</text><text x="1465" y="254" text-anchor="middle" class="t s">de identidad</text><rect x="1310" y="365" width="310" height="125" rx="12" fill="#e5e7eb" stroke="#6b7280" class="box"/><text x="1465" y="403" text-anchor="middle" class="t h">Servicio de validación tributaria</text><text x="1465" y="437" text-anchor="middle" class="t s">Integración opcional</text><text x="1465" y="454" text-anchor="middle" class="t s">según servicio autorizado</text><rect x="1310" y="565" width="310" height="125" rx="12" fill="#e5e7eb" stroke="#6b7280" class="box"/><text x="1465" y="603" text-anchor="middle" class="t h">Archivo Excel</text><text x="1465" y="637" text-anchor="middle" class="t s">Fuente para migración</text><text x="1465" y="654" text-anchor="middle" class="t s">inicial controlada</text><path d="M380,210 L555,340" class="edge"/><text x="467.5" y="268" text-anchor="middle" class="t s">administra</text><path d="M380,395 L555,420" class="edge"/><text x="467.5" y="400.5" text-anchor="middle" class="t s">gestiona</text><path d="M380,580 L555,500" class="edge"/><text x="467.5" y="533" text-anchor="middle" class="t s">consulta / solicita</text><path d="M380,765 L555,565" class="edge"/><text x="467.5" y="658" text-anchor="middle" class="t s">consulta agregados</text><path d="M1145,350 L1310,225" class="dash"/><text x="1227.5" y="280.5" text-anchor="middle" class="t s">valida identidad</text><path d="M1145,445 L1310,425" class="dash"/><text x="1227.5" y="428" text-anchor="middle" class="t s">valida datos</text><path d="M1310,625 L1145,565" class="edge"/><text x="1227.5" y="588" text-anchor="middle" class="t s">migración inicial</text><text x="850" y="895" text-anchor="middle" class="t sub">Los servicios externos son desacoplados: su indisponibilidad no bloquea el núcleo funcional.</text></svg>