  <text x="40" y="65" class="t sub">Contenedor detallado: API Escalafonaria · ASP.NET Core / .NET 8</text><rect x="40" y="100" width="1820" height="1050" rx="10" fill="#ffffff" stroke="#64748b" class="box"/><text x="950" y="135" text-anchor="middle" class="t h">API ESCALAFONARIA · MONOLITO MODULAR</text><rect x="90" y="185" width="1720" height="120" rx="10" fill="#dbeafe" stroke="#3b82f6" class="box"/><text x="950" y="220" text-anchor="middle" class="t h">API REST</text><text x="950" y="250" text-anchor="middle" class="t b">Controllers · autenticación · autorización · validación · manejo de errores</text><rect x="110" y="365" width="285" height="150" rx="10" fill="#8fb5e3" stroke="#5b88bd" class="box"/><text x="252" y="403" text-anchor="middle" class="t h">M01 · Administración y Seguridad</text><text x="252" y="443" text-anchor="middle" class="t s">usuarios · roles · permisos</text><text x="252" y="460" text-anchor="middle" class="t s">sesiones · auditoría</text><rect x="455" y="365" width="285" height="150" rx="10" fill="#8fb5e3" stroke="#5b88bd" class="box"/><text x="597" y="403" text-anchor="middle" class="t h">M02 · Trabajadores y Legajos</text><text x="597" y="443" text-anchor="middle" class="t s">legajo oficial · búsqueda</text><text x="597" y="460" text-anchor="middle" class="t s">estado · trazabilidad</text><rect x="800" y="365" width="285" height="150" rx="10" fill="#8fb5e3" stroke="#5b88bd" class="box"/><text x="942" y="403" text-anchor="middle" class="t h">M03 · Mi Legajo</text><text x="942" y="443" text-anchor="middle" class="t s">consulta propia</text><text x="942" y="460" text-anchor="middle" class="t s">datos iniciales · propuestas</text><rect x="1145" y="365" width="285" height="150" rx="10" fill="#8fb5e3" stroke="#5b88bd" class="box"/><text x="1287" y="403" text-anchor="middle" class="t h">M04 · Gestión Laboral</text><text x="1287" y="443" text-anchor="middle" class="t s">vinculaciones · contratos</text><text x="1287" y="460" text-anchor="middle" cl