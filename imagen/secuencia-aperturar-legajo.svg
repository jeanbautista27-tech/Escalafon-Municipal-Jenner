    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7c3aed"/></marker>
    <style>
      .t{font-family:Arial,sans-serif;fill:#0f172a}.title{font-size:26px;font-weight:700}.sub{font-size:14px;fill:#475569}
      .h{font-size:15px;font-weight:700}.b{font-size:13px}.s{font-size:11px}.box{stroke-width:1.5}
      .edge{stroke:#475569;stroke-width:1.4;fill:none;marker-end:url(#arrow)}.dep{stroke:#7c3aed;stroke-width:1.5;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowPurple)}
      .life{stroke:#cbd5e1;stroke-width:1.3;stroke-dasharray:6 6}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="32" y="38" class="t title">Diagrama de secuencia · Aperturar legajo</text>
  <text x="32" y="62" class="t sub">M02 Gestión de Trabajadores y Legajos · flujo principal</text><rect x="15" y="95" width="190" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" class="box"/><text x="110" y="122" text-anchor="middle" class="t h">Responsable de</text><text x="110" y="138" text-anchor="middle" class="t h">Escalafón</text><line x1="110" y1="159" x2="110" y2="900" class="life"/><rect x="255" y="95" width="190" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" class="box"/><text x="350" y="122" text-anchor="middle" class="t h">LegajosController</text><line x1="350" y1="159" x2="350" y2="900" class="life"/><rect x="495" y="95" width="190" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" class="box"/><text x="590" y="122" text-anchor="middle" class="t h">Validator</text><line x1="590" y1="159" x2="590" y2="900" class="life"/><rect x="735" y="95" width="190" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" class="box"/><text x="830" y="122" text-anchor="middle" class="t h">AperturarLegajo</text><text x="830" y="138" text-anchor="middle" class="t h">UseCase</text><line x1="830" y1="159" x2="830" y2="900" class="life"/><rect x="975" y="95" width="190" height="64" rx="8" fill="#fef3c7" stroke="#d97706" class="box"/><text x="1070" y="122" text-anchor="middle" class="t h">ITrabajador</text><text x="1070" y="138" text-anchor="middle" class="t h">Repository</text><line x1="1070" y1="159" x2="1070" y2="900" class="life"/><rect x="1215" y="95" width="190" height="64" rx="8" fill="#fef3c7" stroke="#d97706" class="box"/><text x="1310" y="122" text-anchor="middle" class="t h">ILocador</text><text x="1310" y="138" text-anchor="middle" class="t h">Repository</text><line x1="1310" y1="159" x2="1310" y2="900" class="life"/><rect x="1455" y="95" width="190" height="64" rx="8" fill="#fef3c7" stroke="#d97706" class="box"/><text x="1550" y="122" text-anchor="middle" class="t h">ILegajo</text><text x="1550" y="138" text-anchor="middle" class="t h">Repository</text><line x1="1550" y1="159" x2="1550" y2="900" class="life"/><rect x="1685" y="95" width="190" height="64" rx="8" fill="#e2e8f0" stroke="#64748b" class="box"/><text x="1780" y="122" text-anchor="middle" class="t h">PostgreSQL</text><line x1="1780" y1="159" x2="1780" y2="900" class="life"/><path d="M110,200 L350,200" class="edge"/><text x="230" y="192" text-anchor="middle" class="t s">1. POST /api/legajos/aperturar { dni }</text><path d="M350,255 L590,255" class="edge"/><text x="470" y="247" text-anchor="middle" class="t s">2. Validar request</text><path d="M350,310 L830,310" class="edge"/><text x="590" y="302" text-anchor="middle" class="t s">3. EjecutarAsync(request)</text><path d="M830,370 L1070,370" class="edge"/><text x="950" y="362" text-anchor="middle" class="t s">4. Verificar DNI con legajo</text><path d="M1070,430 L1780,430" class="edge"/><text x="1425" y="422" text-anchor="middle" class="t s">5. SELECT trabajador / legajo</text><path d="M830,490 L1310,490" class="edge"/><text x="1070" y="482" text-anchor="middle" class="t s">6. Consultar DNI como locador (advertencia)</text><path d="M830,550 L1550,550" class="edge"/><text x="1190" y="542" text-anchor="middle" class="t s">7. GenerarCodigoAsync()</text><path d="M830,610 L1070,610" class="edge"/><text x="950" y="602" text-anchor="middle" class="t s">8. AddAsync(trabajador)</text><path d="M830,670 L1550,670" class="edge"/><text x="1190" y="662" text-anchor="middle" class="t s">9. AddAsync(legajo)</text><path d="M1550,730 L1780,730" class="edge"/><text x="1665" y="722" text-anchor="middle" class="t s">10. Guardar transacción</text><path d="M830,800 L350,800" class="dep"/><text x="590" y="792" text-anchor="middle" class="t s">11. AperturarLegajoResponse</text><path d="M350,855 L110,855" class="dep"/><text x="230" y="847" text-anchor="middle" class="t s">12. 201 Created · trabajadorId · legajoId · código</text><rect x="520" y="910" width="900" height="60" rx="8" fill="#fff7ed" stroke="#fdba74" class="box"/><text x="970" y="934" text-anchor="middle" class="t s">Regla: un DNI con trabajador y legajo existente impide crear un segundo legajo.</text><text x="970" y="950" text-anchor="middle" class="t s">Si el DNI existe solo como locador, se informa como advertencia y el flujo puede continuar.</text></svg>